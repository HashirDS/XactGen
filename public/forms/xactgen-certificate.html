<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XactGen AI — Certificate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a0d18;
      --muted: #5c6b82;
      --line: #d5dbe8;
      --paper: #f3f5fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #d9deea;
      color: var(--ink);
      font-family: Onest, "Segoe UI", sans-serif;
    }

    .toolbar {
      width: 297mm;
      margin: 14px auto 0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toolbar a,
    .toolbar button {
      border: 0;
      background: #12172a;
      color: #fff;
      font: 600 14px/1 Onest, "Segoe UI", sans-serif;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
    }

    .sheet {
      width: 297mm;
      height: 210mm;
      margin: 12px auto 28px;
      background: var(--paper);
      padding: 8mm;
      box-shadow: 0 16px 40px rgba(10, 13, 24, 0.16);
    }

    .frame {
      position: relative;
      height: 100%;
      background: #fff;
      border: 1.5px solid #161b2e;
      padding: 14mm 16mm 12mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 3.2mm;
      border: 1px solid #e1e6f2;
      pointer-events: none;
    }

    .bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 7px;
      background: linear-gradient(90deg, #22d3ee 0%, #6366f1 48%, #c084fc 100%);
    }

    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; height: 5px; }

    header.brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: #070b16;
      object-fit: cover;
    }

    .identity strong {
      display: block;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    .identity strong span { color: #7c3aed; }

    .identity em {
      display: block;
      margin-top: 2px;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .meta {
      text-align: right;
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 500;
    }

    .meta b {
      display: block;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6mm 8mm 2mm;
    }

    .kicker {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: #312e81;
    }

    .of {
      margin-top: 6px;
      width: min(160mm, 100%);
      border: 0;
      background: transparent;
      text-align: center;
      font: italic 500 22px/1.2 "Instrument Serif", Georgia, serif;
      color: #4338ca;
    }

    .presented {
      margin: 8mm 0 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .name {
      width: min(220mm, 100%);
      margin-top: 2mm;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      text-align: center;
      font: 400 54px/1.05 "Instrument Serif", Georgia, serif;
      color: var(--ink);
    }

    .name::placeholder { color: #c5cad6; }

    .glow {
      width: 72px;
      height: 3px;
      margin: 5mm 0 4mm;
      border-radius: 99px;
      background: linear-gradient(90deg, #22d3ee, #c084fc);
    }

    .detail {
      width: min(190mm, 100%);
      border: 0;
      background: transparent;
      resize: none;
      text-align: center;
      font: 400 16px/1.45 Onest, "Segoe UI", sans-serif;
      color: #243049;
    }

    .detail::placeholder { color: #b7becc; }

    footer.sign {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12mm;
      align-items: end;
      padding-top: 2mm;
    }

    footer.sign label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer.sign label.center { align-items: center; text-align: center; }
    footer.sign label.right { align-items: flex-end; text-align: right; }

    footer.sign input {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #1c2438;
      background: transparent;
      font: 500 14px/1.3 Onest, "Segoe UI", sans-serif;
      color: var(--ink);
      padding: 4px 0 3px;
      text-align: left;
    }

    footer.sign label.center input { text-align: center; }
    footer.sign label.right input { text-align: right; }

    .role {
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: none;
      color: #243049;
      font-weight: 600;
    }

    @page { size: A4 landscape; margin: 0; }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet {
        width: 297mm;
        height: 210mm;
        margin: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="xactgen-certificate.pdf" download>Download PDF</a>
    <button type="button" onclick="window.print()">Print</button>
  </div>

  <article class="sheet">
    <div class="frame">
      <div class="bar top"></div>
      <div class="bar bottom"></div>

      <header class="brand">
        <div class="identity">
          <img class="mark" src="logo.png" alt="" />
          <div>
            <strong>XactGen <span>AI</span></strong>
            <em>Exact solutions for the next generation</em>
          </div>
        </div>
        <div class="meta">
          <b>Official certificate</b>
          Software Technology Park<br />
          University of Kotli AJK<br />
          www.xactgenai.com
        </div>
      </header>

      <main>
        <p class="kicker">Certificate</p>
        <input class="of" name="kind" aria-label="Certificate type" value="of Recognition" />
        <p class="presented">This is presented to</p>
        <input class="name" name="recipient" aria-label="Recipient name" placeholder="Recipient name" />
        <div class="glow"></div>
        <textarea class="detail" name="detail" rows="2" aria-label="What this certificate is for" placeholder="For the work, role, or training named here."></textarea>
      </main>

      <footer class="sign">
        <label>
          Date
          <input name="issued" placeholder="DD / MM / YYYY" />
        </label>
        <label class="center">
          Certificate number
          <input name="number" placeholder="XG-2026-001" />
        </label>
        <label class="right">
          <input name="signatory" aria-label="Signature" />
          <span class="role">Founder &amp; CEO, XactGen AI</span>
        </label>
      </footer>
    </div>
  </article>
</body>
</html>
